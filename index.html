<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        .counter {
            font-size: 64px;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <h1>Aguarde um momento</h1>
        <p>Você será redirecionado para a página de destino em breve...</p>
        
        <div class="counter" id="counter">5</div>
        
        <p>Se você não for redirecionado automaticamente, clique no botão abaixo.</p>
        <a href="#" id="manual-link" class="btn button">Clique aqui</a>
    </div>

    <script>
        // CONFIGURAÇÕES
        const redirecionarPara = "https://www.exemplo.com.br"; // Substitua pela URL desejada
        let tempoRestante = 5; // Tempo em segundos

        // Configura o link manual
        document.getElementById('manual-link').href = redirecionarPara;

        const counterElement = document.getElementById('counter');

        const intervalo = setInterval(() => {
            tempoRestante--;
            counterElement.textContent = tempoRestante;

            if (tempoRestante <= 0) {
                clearInterval(intervalo);
                document.getElementById('manual-link').click();
            }
        }, 1000);
    </script>

    <script>
    (function() {
      var u = new URLSearchParams(window.location.search);
      var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id','fbclid','ttclid','click_id','_fbp','gclid','xcod','sck','cv','salesCode','rby'];
      var captured = {};
      KEYS.forEach(function(k){ var v = u.get(k); if (v) captured[k] = v; });
      try {
        var saved = JSON.parse(sessionStorage.getItem('ruby_utms') || '{}');
        Object.keys(captured).forEach(function(k){ saved[k] = captured[k]; });
        sessionStorage.setItem('ruby_utms', JSON.stringify(saved));
        captured = saved;
      } catch(e) {}
      function buildLink(originalHref) {
        var url = new URL(originalHref, location.origin);
        Object.keys(captured).forEach(function(k){
          if (!url.searchParams.has(k)) url.searchParams.set(k, captured[k]);
        });
        return url.toString();
      }
      function attach() {
        document.querySelectorAll('a.button, a.cta, a[href*="/r/"], a[href*="/redirects/"], a[href*="/redirect/"]').forEach(function(btn){
          btn.addEventListener('click', function(e){
            try { btn.href = buildLink(btn.href); } catch(err) {}
          }, { once: false, capture: true });
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attach);
      } else {
        attach();
      }
    })();
    </script>

</body>
</html>
